
# cargo-vet config file

[cargo-vet]
version = "0.10"

[imports.google]
url = "https://raw.githubusercontent.com/google/rust-crate-audits/main/audits.toml"

[imports.mozilla]
url = "https://raw.githubusercontent.com/mozilla/supply-chain/main/audits.toml"

[policy.rust-9p]
audit-as-crates-io = false
notes = 'Vendored at vendor/rust-9p/ (path-dep, renamed to `rs9p` in Cargo.toml line 70 via package = "rust-9p"). Phase 26 SUPPLY-06 (docs/vendoring-policy.md) is the single source of truth for vendored-dep review + update cadence + divergence-from-upstream policy. Phase 24 ships this [policy.*] entry as the forward-pointer; the audit narrative lands in Phase 26.'

[policy.trelis-hybrid]
audit-as-crates-io = false
notes = "Tracked by AUDIT-01 (external third-party audit, backlog item per .planning/REQUIREMENTS.md). Pinned by git rev 5374dff482ba94a94695794b5e4554f908eb0d4d (Cargo.toml line 82). EXPERIMENTAL — D-V23-06 no-scrub rule: disclaimer retained. trelis-pin grep invariant enforced by .github/workflows/supply-chain.yml (Plan 24-03 SUPPLY-05)."

[policy.trelis-primitives]
audit-as-crates-io = false
notes = "Tracked by AUDIT-01. Pinned by git rev 5374dff482ba94a94695794b5e4554f908eb0d4d (Cargo.toml line 83). EXPERIMENTAL — D-V23-06 no-scrub rule: disclaimer retained. Same grep invariant as trelis-hybrid."

