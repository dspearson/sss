[graph]
# SUPPLY-01 — check the Linux-build dep surface: hybrid (PQ crypto), fuse
# (FUSE mount), ninep (9P protocol). winfsp deliberately EXCLUDED because
# winfsp-sys ships under GPL-3.0 (incompatible with sss's ISC licence) and
# is a Windows-only optional surface; D-SAN-1 + v2.3 release host memory
# confirm Linux x86_64 + macOS arm64 + Linux aarch64 as the primary
# targets. Windows is best-effort and revisited if a Windows release
# target is added (v2.4+).
features = ["hybrid", "fuse", "ninep"]

[licenses]
confidence-threshold = 0.8

allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
]

# Phase 10 / DEPS-02 — full advisory / bans / sources policy.
# Phase 24 / SUPPLY-01 — strictness uplift: multiple-versions = "deny" +
# unsound = "all" (scope); curated skip list per D-DENY-1 with 30-day refresh SLA.

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
unmaintained = "workspace"
unsound = "all"
# `notice` removed in cargo-deny 0.19 (EmbarkStudios/cargo-deny#611);
# use `ignore` per-advisory if a notice-level RUSTSEC needs to be silenced.
ignore = [
    # Format: "RUSTSEC-YYYY-NNNNN", # rationale; expires: YYYY-MM-DD
    # Why: fuser 0.14 has an uninitialised-memory-read in libfuse session
    # creation (fix in fuser >=0.16.0). Bump deferred to Phase 25 (SBOM +
    # release-artefact work touches the FUSE binary surface anyway) so the
    # API migration lands alongside that work. Tracked in v2.3 audit
    # closeout (Phase 27 AUDIT-03). Expires: 2026-08-19.
    "RUSTSEC-2021-0154",
    # Why: rand 0.9.2 is unsound only when a custom log::Log implementation
    # is registered AND that logger calls rand::rng()/TryRng at trace level
    # (Stacked Borrows violation per @lopopolo). sss does not register a
    # custom logger of any kind and proptest is the only dev-dep consumer
    # of rand 0.9. CI fresh-resolves Cargo.lock (gitignored) so the
    # specific rand version may vary; this ignore keeps the gate stable
    # until proptest publishes against rand >=0.9.3. Expires: 2026-08-19.
    "RUSTSEC-2026-0097",
]

[bans]
# SUPPLY-01 / D-DENY-1 — hard-deny duplicates. Each skip entry carries a
# `# Why: …` rationale + a refresh date 30 days out. Refresh = re-justify
# the rationale (transitive still applies) or remove the entry (upstream
# consolidated). CI does NOT hard-fail on stale skip in v2.3 (informational
# only — promoted to gate in v2.4 per CONTEXT 24 Deferred).
multiple-versions = "deny"
wildcards = "deny"
# Why: sss declares path/git deps without explicit versions (rust-9p path,
# trelis-* git rev). Standard cargo-deny posture for vendored/git deps.
allow-wildcard-paths = true
deny = [
]
skip = [
    # ─── Hybrid crypto chain (trelis-primitives + trelis-hybrid) ───
    # Why: dual-track digest stack — fips204 v0.4.6 + sha3 v0.11.0 (newer
    # 0.11 line) vs ed448-goldilocks-plus + chacha20poly1305 + blake3
    # (older 0.10 line). Upstream consolidation tracked at AUDIT-01.
    # (Refresh by 2026-06-19)
    { crate = "block-buffer@0.10.4", reason = "ed448/chacha20poly1305/blake3 use digest 0.10 line via trelis-primitives" },
    { crate = "crypto-common@0.1.7", reason = "ed448/chacha20poly1305/blake3 use digest 0.10 line via trelis-primitives" },
    { crate = "digest@0.10.7", reason = "ed448/chacha20poly1305/blake3 use digest 0.10 line via trelis-primitives" },
    { crate = "sha3@0.10.9", reason = "ed448-goldilocks-plus v0.16 + fips204 v0.4.6 transitives via trelis" },
    { crate = "keccak@0.1.6", reason = "sha3 0.10 transitive (mechanical follow-on of digest split)" },

    # Why: chacha20 stream — 0.9.1 from chacha20poly1305 v0.10.1 (AEAD),
    # 0.10.0 from rand v0.10.1 (ntrulp). Different consumers, both via
    # trelis-primitives. AUDIT-01. (Refresh by 2026-06-19)
    { crate = "chacha20@0.9.1", reason = "chacha20poly1305 v0.10.1 AEAD primitive via trelis-primitives" },

    # Why: cpufeatures 0.2 from chacha20 0.9 + sha2 0.10 line; 0.3 from
    # blake3 + chacha20 0.10. Compile-time SIMD detection; no runtime
    # behaviour change. AUDIT-01. (Refresh by 2026-06-19)
    { crate = "cpufeatures@0.2.17", reason = "SIMD detection for chacha20 0.9 + sha2 0.10 line" },

    # Why: getrandom split — 0.2 from trelis-primitives transitives,
    # 0.3 from rand 0.9 + proptest dev-dep, 0.4 from pqcrypto-internals /
    # newer rand_core line. AUDIT-01. (Refresh by 2026-06-19)
    { crate = "getrandom@0.2.16", reason = "trelis-primitives transitive (oldest line)" },
    { crate = "getrandom@0.3.4", reason = "rand 0.9 + proptest dev-dep transitive (middle line)" },

    # Why: rand_core 0.6.4 from older RNG users (ntrulp's older deps);
    # rand_core 0.10.1 from rand 0.10 / pqcrypto-internals. proptest's
    # rand_core 0.9.3 is not in cargo-deny's resolved graph (dev-dep
    # not surfaced; tracked at AUDIT-01). (Refresh by 2026-06-19)
    { crate = "rand_core@0.6.4", reason = "older rand_core line used by transitive RNG consumers" },

    # Why: rustix 0.38 from proptest dev-dep (via which); 1.x from tempfile.
    # linux-raw-sys split is a mechanical follow-on. Dev/test path only.
    # (Refresh by 2026-06-19)
    { crate = "rustix@0.38.44", reason = "proptest 1.9 dev-dep transitive (which crate)" },
    { crate = "linux-raw-sys@0.4.15", reason = "rustix 0.38 transitive (proptest dev-dep path)" },

    # Why: serdect 0.2 from elliptic-curve 0.13 (ed448 path);
    # 0.3 from newer crypto layer. Mechanical follow-on of digest split.
    # (Refresh by 2026-06-19)
    { crate = "serdect@0.2.0", reason = "elliptic-curve 0.13 / ed448-goldilocks-plus transitive" },

    # Why: signature 2.2 from ed448-goldilocks-plus; 3.0-rc from newer
    # signing-trait users. Mechanical follow-on of digest split.
    # (Refresh by 2026-06-19)
    { crate = "signature@2.2.0", reason = "ed448-goldilocks-plus v0.16 transitive" },

    # ─── Cross-cutting transitives ───
    # Why: bitflags 1.3 from nix 0.26 (via rust-9p path dep); 2.10 from
    # libredox/redox_users (dirs-sys), nix 0.30 (ctrlc), proptest,
    # redox_syscall (parking_lot), rustix 0.38/1.x (which/tempfile),
    # bindgen (winfsp-sys; gated off but in lock). Upstream nix 0.30+
    # already on bitflags 2; bumping rust-9p's nix is a Phase 26 vendoring
    # task. (Refresh by 2026-06-19)
    { crate = "bitflags@1.3.2", reason = "nix 0.26 transitive via vendored rust-9p" },

    # Why: nix 0.26.4 from rust-9p (9P protocol); nix 0.30.1 from ctrlc.
    # Both consumers stable; bumping rust-9p's nix is a Phase 26 vendoring
    # task. (Refresh by 2026-06-19)
    { crate = "nix@0.26.4", reason = "vendored rust-9p uses older nix line" },

    # Why: num-traits 0.1.43 from enum_primitive 0.1 (vendored rust-9p
    # transitive); 0.2.19 from anything-modern. The 0.1 line is essentially
    # frozen but its only consumer is enum_primitive. (Refresh by 2026-06-19)
    { crate = "num-traits@0.1.43", reason = "enum_primitive 0.1 transitive via vendored rust-9p" },

    # Why: r-efi 5.3 / 6.0 — UEFI runtime ABI from getrandom 0.2/0.3
    # respectively. Mechanical follow-on of the getrandom split.
    # (Refresh by 2026-06-19)
    { crate = "r-efi@5.3.0", reason = "getrandom 0.2/0.3 UEFI-target ABI" },

    # Why: wit-bindgen 0.46 / 0.51 — WASM Component Model glue from
    # getrandom 0.2/0.3 wasi targets. Same split-driver as r-efi.
    # (Refresh by 2026-06-19)
    { crate = "wit-bindgen@0.46.0", reason = "getrandom 0.2/0.3 wasi-target glue" },

    # Why: zerocopy 0.7 from fuser 0.14; 0.8 from criterion dev-dep
    # (ciborium) + ppv-lite86 (rand_chacha). fuser bump is deferred to
    # Phase 25 (per RUSTSEC-2021-0154 ignore note); zerocopy split clears
    # naturally when fuser bumps. (Refresh by 2026-06-19)
    { crate = "zerocopy@0.7.35", reason = "fuser 0.14 transitive (bumps to 0.8 when fuser >=0.16 lands)" },
    { crate = "zerocopy-derive@0.7.35", reason = "mechanical follow-on of zerocopy split" },

    # ─── Windows transitives (cross-platform crates) ───
    # Why: Windows transitives via dirs-sys (directories/dirs), rpassword,
    # rustix/tempfile, clap (anstream/anstyle), ctrlc, walkdir. sss
    # primary release targets are Linux x86_64 + macOS arm64 + Linux
    # aarch64 (per build-host memory); Windows is best-effort. Multiple
    # versions co-exist because consumer crates pin different
    # windows-targets generations. AUDIT-01 will revisit if a Windows
    # release target is added in v2.4+. (Refresh by 2026-06-19)
    { crate = "windows-sys", reason = "multi-version transitive via dirs-sys/rpassword/clap/tempfile chains" },
    { crate = "windows-targets", reason = "multi-version follow-on of windows-sys split" },
    { crate = "windows_aarch64_gnullvm", reason = "windows-targets per-arch assemblies" },
    { crate = "windows_aarch64_msvc", reason = "windows-targets per-arch assemblies" },
    { crate = "windows_i686_gnu", reason = "windows-targets per-arch assemblies" },
    { crate = "windows_i686_gnullvm", reason = "windows-targets per-arch assemblies" },
    { crate = "windows_i686_msvc", reason = "windows-targets per-arch assemblies" },
    { crate = "windows_x86_64_gnu", reason = "windows-targets per-arch assemblies" },
    { crate = "windows_x86_64_gnullvm", reason = "windows-targets per-arch assemblies" },
    { crate = "windows_x86_64_msvc", reason = "windows-targets per-arch assemblies" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/dspearson/trelis",
]
