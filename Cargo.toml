[package]
name = "sss"
version = "2.0.1"
edition = "2024"
license = "ISC"
authors = ["Dominic Pearson <dsp@technoanimal.net>"]
# Not published to crates.io — release artefacts are distributed via GitHub
# releases + Registry. SUPPLY-01 (Phase 24): marks sss as non-public so
# cargo-deny's `allow-wildcard-paths` applies to the rust-9p vendored path
# dep + trelis git-rev deps. Reproducible-build verification (Phase 26)
# uses these path/git pins directly.
publish = false

[features]
default = []
fuse = ["dep:fuser", "dep:parking_lot"]
winfsp = ["dep:winfsp", "dep:parking_lot", "dep:widestring", "dep:winapi"]
ninep = ["dep:rs9p", "dep:tokio", "dep:tokio-stream", "dep:async-trait", "dep:parking_lot"]
hybrid = ["dep:trelis-hybrid", "dep:trelis-primitives"]
vault = ["dep:ureq"]
slow-tests = []

[[bin]]
name = "sss"
path = "src/main.rs"

[[bin]]
name = "sss-agent"
path = "src/bin/sss-agent.rs"

[[bin]]
name = "sss-askpass-tty"
path = "src/bin/sss-askpass-tty.rs"

[[bin]]
name = "sss-askpass-gui"
path = "src/bin/sss-askpass-gui.rs"

[dependencies]
base64 = "0.22"
toml = "0.8"
clap = { version = "4.5.47", features = ["derive"] }
anyhow = "1.0.99"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
tempfile = "3.21.0"
which = "4.4"
libsodium-sys = "0.2"
keyring = "3.2"
zeroize = { version = "1.8", features = ["derive"] }
directories = "5.0"
rpassword = "7.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4"] }
subtle = "2.5"
dirs = "5.0"
ctrlc = "3.4"
serde_json = "1.0"
fuser = { version = "0.16", optional = true }
parking_lot = { version = "0.12", optional = true }
winfsp = { version = "0.12", optional = true }
widestring = { version = "1.1", optional = true }
winapi = { version = "0.3", features = ["fileapi", "handleapi", "winbase", "winnt"], optional = true }
similar = "2.3"
aho-corasick = "1.1"
thiserror = "1.0"
libc = "0.2.177"
walkdir = "2.4"
globset = "0.4"
# ----------------------------------------------------------------------
# rust-9p path-dep (feature = "ninep", default OFF).
# No suitable crates.io release; vendored as a path-dep tree under
# vendor/rust-9p/ to keep fresh clones buildable without manual setup.
# Refresh: drop new sources into vendor/rust-9p/ and commit.
# See docs/RELEASE.md § Vendored Dependencies for the freeze rationale.
# ----------------------------------------------------------------------
rs9p = { package = "rust-9p", path = "vendor/rust-9p", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tokio-stream = { version = "0.1", features = ["fs"], optional = true }
async-trait = { version = "0.1", optional = true }
nix = { version = "0.26" }
# REM-26 (CRY-12): debug-level signer identity logging in verify_envelope_signature.
# Using log (already a transitive dep) instead of tracing to avoid adding three
# unvetted crates (tracing, tracing-core, tracing-attributes) to the supply chain.
log = "0.4"

# ----------------------------------------------------------------------
# Vault HTTP+TLS client (feature = "vault", default OFF).
# Blocking HTTPS client for HashiCorp Vault KV v2 reads on the synchronous
# render path (VNET-01..03).
#
# Backend: ring rustls (NOT aws-lc-rs) — aws-lc-rs requires nasm on non-x86
# and breaks Alpine/musl cross-compile; ring builds statically via cc.
# See .planning/research/STACK.md §1 for the full 12-crate transitive tree.
#
# Source: crates.io (pinned in the committed Cargo.lock via cargo-vet — NOT
# vendored; vendoring is only for non-crates.io deps such as rust-9p/trelis).
#
# tokio is NOT pulled in: ureq 3.x is a blocking client by design; the vault
# feature is independent of the ninep feature. Verified via:
#   cargo tree --features vault -i tokio  (must report "tokio" not reachable)
#
# JSON parsing reuses the existing serde_json dep; the ureq `json` feature is
# NOT enabled (avoids re-exporting serde/serde_json through ureq).
#
# default-features = false DISABLES ureq's `gzip` default (ureq default = ["rustls",
# "gzip"]); Vault's small JSON responses don't need response compression, so we drop
# the flate2 / miniz_oxide / adler2 / crc32fast / simd-adler32 sub-tree (5 crates,
# 19 -> 14 net-new). `rustls` is re-added explicitly. (Supply-chain trim, Phase 47.)
#
# rustls and ring are NOT declared directly — they are transitive via ureq.
# A direct pin would risk version divergence in deny.toml (STACK.md §4).
# ----------------------------------------------------------------------
ureq = { version = "3.3.0", default-features = false, features = ["rustls", "rustls-webpki-roots"], optional = true }

# ----------------------------------------------------------------------
# Hybrid post-quantum KEM deps (feature = "hybrid", default OFF).
# trelis is experimental / unaudited upstream — pin by SHA, never branch.
# Pinned commit: 5374dff482ba94a94695794b5e4554f908eb0d4d (2026-04-24).
# See .planning/phases/02-hybrid-suite/02-CONTEXT.md for rationale.
# ----------------------------------------------------------------------
trelis-hybrid = { git = "https://github.com/dspearson/trelis", rev = "5374dff482ba94a94695794b5e4554f908eb0d4d", optional = true }
trelis-primitives = { git = "https://github.com/dspearson/trelis", rev = "5374dff482ba94a94695794b5e4554f908eb0d4d", optional = true }

[dev-dependencies]
tempfile = "3.21.0"
proptest = "1.5"
criterion = "0.5"
serial_test = "3.0"

[[bench]]
name = "marker_inference"
harness = false

[[bench]]
name = "project_ops"
harness = false

[[bench]]
name = "marker_processing"
harness = false

[[bench]]
name = "fuse_read_latency"
harness = false

# Phase 40-01 (REM-09) — peer-credential verification unit tests.
# Exercises verify_peer_credentials + enforce_peer_identity over a real
# UnixStream::pair() socketpair.  No feature gate required: nix is now
# a non-optional dependency.
[[test]]
name = "agent_peer_cred"
path = "tests/agent_peer_cred.rs"

# REM-11 socket-bind correctness: Linux abstract socket (ignores stale fs path,
# EADDRINUSE on double-bind) + refuse-if-exists semantics (all platforms).
# No feature gate required: uses only stdlib Unix socket APIs.
[[test]]
name = "agent_socket_bind"
path = "tests/agent_socket_bind.rs"

[[test]]
name = "migrate_e2e"
path = "tests/migrate_e2e.rs"
required-features = ["hybrid"]

[[test]]
name = "soak_agent"
path = "tests/soak_agent.rs"
required-features = ["hybrid", "slow-tests"]

[[test]]
name = "stress_render"
path = "tests/stress_render.rs"
required-features = ["hybrid", "slow-tests"]

# Phase 18-05 (PQSIG closure) — negative-path tests for v2 keystore-entry
# hybrid AND-composition signatures. Belt-and-braces feature gating:
# this binary cannot compile without `hybrid`, AND the source file is
# `#![cfg(feature = "hybrid")]`-gated. `cargo test` (no flags) skips it.
[[test]]
name = "keystore_signature_negative_paths"
path = "tests/keystore_signature_negative_paths.rs"
required-features = ["hybrid"]

# Phase 19-02 (PQSIG-05) — sign-on-write integration tests.
# Exercises all four CLI verbs (init, user add, user remove, migrate) via the
# real sss binary and asserts the resulting .sss.toml carries a valid
# [envelope.sig] table with non-empty ed448 + mldsa65 base64 legs.
[[test]]
name = "envelope_signature_negative_paths"
path = "tests/envelope_signature_negative_paths.rs"
required-features = ["hybrid"]

# Phase 46-02 (VCFG-01..03,05,06) — vault config + envelope-sig v3 integration tests.
# Exercises the v2/v3 signed envelope (sign + verify), so the whole file is hybrid-only.
[[test]]
name = "vault_config_envelope_sig"
path = "tests/vault_config_envelope_sig.rs"
required-features = ["hybrid"]

# Phase 46-03 (VCFG-04, VCLI-04) — vault CLI sign-on-write integration tests.
# Proves set-address/add-binding/set-auth re-sign to format_version=3; idempotency;
# downgrade rejection; upgrade-sig v2/v3 target selection.
[[test]]
name = "vault_cli_signon"
path = "tests/vault_cli_signon.rs"
required-features = ["hybrid"]

# Phase 46.1-01 (VSIG-01, VCFG-02/03) — envelope-sig v2/v3 versioning + backward-compat
# locks: STATIC committed golden fv=2 fixture (verify-only drift lock), fv=2/fv=3
# round-trips with cross-context-failure, and the fv=2 no-vault-region payload assertion.
[[test]]
name = "envelope_v2_v3_versioning"
path = "tests/envelope_v2_v3_versioning.rs"
required-features = ["hybrid"]

# Phase 30-01 (TEST-14) — Known-Answer Tests for crypto primitives.
# Default arm: XChaCha20-Poly1305 secretbox regression freeze + gap documentation.
# No required-features: libsodium-sys is always available.
[[test]]
name = "crypto_kat"
path = "tests/crypto_kat.rs"

# Phase 30-01 (TEST-14) — Known-Answer Tests for hybrid primitives.
# Hybrid arm: X448 RFC 7748 §6.2, Ed448 RFC 8032 §7.4, ML-DSA-65 NIST ACVP.
# Belt-and-braces gating: required-features AND #![cfg(feature = "hybrid")] in source.
[[test]]
name = "hybrid_kat"
path = "tests/hybrid_kat.rs"
required-features = ["hybrid"]

# Phase 47-01 (VNET-01..03) — Vault blocking transport + KV v2 client tests.
# Exercises JSON extraction, missing/soft-deleted/destroyed discrimination,
# response-size-cap rejection, and SSRF address validation.
# Belt-and-braces gating: required-features AND #![cfg(feature = "vault")] in source.
[[test]]
name = "vault_client_transport"
path = "tests/vault_client_transport.rs"
required-features = ["vault"]

# Phase 47-03 (VAUTH-01..05, VNET-04) — Vault auth + request-scoped resolver tests.
# Exercises AppRole/renew/lookup body parsing, env-over-.secrets credential
# precedence, the ReferenceMiss-vs-WholeOperation seam, single-login/single-fetch
# request caching, and ZeroizeOnDrop of the request cache — all against crafted
# JSON (no live Vault). serial_test serialises the process-global env mutation.
# Belt-and-braces gating: required-features AND #![cfg(feature = "vault")] in source.
[[test]]
name = "vault_auth_resolver"
path = "tests/vault_auth_resolver.rs"
required-features = ["vault"]

# Exit-code contract for vault render errors (47-04): exit 3 = per-reference
# miss, exit 4 = whole-operation abort.  Tests use std::process::Command so
# they can inspect the actual process exit status.  required-features guards
# the test so it is not built or run without --features vault.
[[test]]
name = "vault_render_exit_codes"
path = "tests/vault_render_exit_codes.rs"
required-features = ["vault"]

# Phase 47-05 (VAUTH-01, VAUTH-05, VNET-02, VFAIL-01, VFAIL-02) — Live
# ephemeral-Vault integration tier.  Starts a real dev-mode OpenBao (bao) via
# process-compose (no container runtime required), seeds KV-v2 + AppRole over
# REST, and exercises the full IT matrix: KV happy-path, AppRole login,
# @version pin, exit-3 (ACL-denied ref), exit-4 (dead port), token-not-logged.
# Skip-gracefully when process-compose/bao are absent (not inside nix devShell);
# default `cargo test` never needs nix or network.
# Invocation: nix develop .#vault-it --command cargo test --features vault,hybrid --test vault_integration
# Belt-and-braces gating: required-features AND #![cfg(feature = "vault")] in source.
# Also requires "hybrid" because the IT harness's init_sss_project calls
# `sss keys upgrade` (sign the classic key) before `sss init` — `sss init`
# rejects unsigned format_version=1 keystore entries (get_current_keypair calls
# load_keypair(.., allow_unsigned=false)), and the re-signing step in `keys upgrade`
# requires hybrid primitives.  The test itself never exercises PQ crypto; the
# hybrid dependency is purely for the project-setup helper.  This constraint
# cannot be removed without adding an --allow-unsigned flag to `sss init`.
[[test]]
name = "vault_integration"
path = "tests/vault_integration.rs"
required-features = ["vault", "hybrid"]

# Invocation: cargo test --features vault,hybrid,fuse --test vault_mount_integration --no-run
# (compile-only on CI; live tier requires /dev/fuse + OpenBao — skips gracefully otherwise)
# Belt-and-braces gating: required-features AND #![cfg(all(feature="vault", ...))] in source.
[[test]]
name = "vault_mount_integration"
path = "tests/vault_mount_integration.rs"
required-features = ["vault", "hybrid", "fuse"]

# ----------------------------------------------------------------------
# Workspace clippy strictness contract (Phase 21 / QUAL-01).
# Single source-of-truth lint policy per locked decision D-V23-02.
# Rationale lives in docs/CLIPPY-POLICY.md (Plan 21-05).
# ----------------------------------------------------------------------
[lints.clippy]
# Baseline strictness floor — pedantic group at warn, priority -1
# so cherry-picked deny lints below win conflicts.
pedantic = { level = "warn", priority = -1 }

# Pedantic-noise suppressions (the only four universally rejected).
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unnecessary_wraps = "allow"

# Panic-surface gates (QUAL-03) — lock v2.1 Phase 8 HARDEN gains.
# Test code carved out at crate-root via cfg_attr(test, allow(...)).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Unsafe-block discipline (QUAL-05) — closes v2.1 Phase 8 classic.rs:91 gap.
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

# Zeroisation hygiene — complements MEMSAFE-05 (Phase 23).
mem_forget = "deny"

# Cast-surface auditor anchors (priority=-1 to avoid warn-on-warn
# duplication; lints are already pedantic members at warn).
cast_possible_truncation = { level = "warn", priority = -1 }
cast_sign_loss = { level = "warn", priority = -1 }

# Phase 26 / BUILD-02 — reproducible-build determinism.
# NOTE: `[profile.release] trim-paths = "all"` is still cargo-unstable as
# of cargo 1.93.1 (gated behind `cargo-features = ["profile-trim-paths"]`
# + nightly). For v2.3 we use `--remap-path-prefix` via RUSTFLAGS in
# scripts/release/build-reproducible.sh instead — stable, equivalent
# effect on the resulting binary. The Cargo profile trim-paths option
# will be adopted in v2.4 once it stabilises.
